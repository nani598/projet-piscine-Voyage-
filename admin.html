<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VoyageVista - Admin</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #F8F6F1; color: #1A1A2E; }

        .navbar {
            background: #1B2A4A;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-logo { color: white; font-size: 22px; font-weight: bold; cursor: pointer; }
        .navbar-btn {
            background: transparent; color: white; border: 1px solid white;
            padding: 8px 16px; cursor: pointer; border-radius: 4px; font-size: 13px;
        }
        .admin-badge {
            background: #E24B4A;
            color: white;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 10px;
        }

        /* LAYOUT */
        .layout { display: flex; min-height: calc(100vh - 60px); }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background: #1B2A4A;
            padding: 25px 0;
            flex-shrink: 0;
        }
        .sidebar-title {
            color: #D6E4F0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 20px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 10px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 13px;
            color: #D6E4F0;
            border-left: 3px solid transparent;
        }
        .menu-item:hover { background: rgba(255,255,255,0.08); color: white; }
        .menu-item.active {
            background: rgba(255,255,255,0.12);
            color: white;
            border-left: 3px solid white;
            font-weight: bold;
        }
        .menu-badge {
            background: #E24B4A;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: auto;
        }

        /* CONTENU */
        .main-content { flex: 1; padding: 30px; overflow-x: auto; }
        .page-title {
            font-size: 22px;
            font-weight: bold;
            color: #1B2A4A;
            margin-bottom: 25px;
        }

        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 8px;
            border: 1px solid #E2DDD6;
            padding: 20px;
            border-top: 3px solid;
        }
        .stat-number { font-size: 32px; font-weight: bold; margin-bottom: 4px; }
        .stat-label { font-size: 13px; color: #6B7280; }
        .stat-trend { font-size: 11px; margin-top: 6px; }

        /* TABLEAU */
        .table-card {
            background: white;
            border-radius: 8px;
            border: 1px solid #E2DDD6;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .table-header {
            padding: 16px 20px;
            border-bottom: 1px solid #E2DDD6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-titre { font-size: 15px; font-weight: bold; color: #1B2A4A; }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #F8F6F1;
            padding: 10px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: bold;
            color: #6B7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #E2DDD6;
        }
        td {
            padding: 12px 16px;
            font-size: 13px;
            border-bottom: 1px solid #F8F6F1;
            color: #1A1A2E;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #F8F6F1; }

        .badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-success { background: #D5F0E4; color: #1A6B4A; }
        .badge-warning { background: #FDE8D0; color: #C75B00; }
        .badge-danger { background: #FCEBEB; color: #A32D2D; }
        .badge-gray { background: #F1EFE8; color: #6B7280; }
        .badge-blue { background: #D6E4F0; color: #1B2A4A; }

        /* BOUTONS */
        .btn {
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            border: none;
            margin-right: 5px;
        }
        .btn-primary { background: #1B2A4A; color: white; }
        .btn-success { background: #1A6B4A; color: white; }
        .btn-danger { background: #E24B4A; color: white; }
        .btn-outline {
            background: white;
            color: #1B2A4A;
            border: 1px solid #1B2A4A;
        }
        .btn-add {
            background: #1B2A4A;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        /* ACTIONS RAPIDES */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .action-btn {
            background: white;
            border: 1px solid #E2DDD6;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            color: #1A1A2E;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .action-btn:hover { border-color: #1B2A4A; background: #F8F6F1; }
        .action-icon { font-size: 20px; }

        /* GRAPHIQUE SIMPLE */
        .graph-bars {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            padding: 10px 0;
        }
        .graph-bar-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .graph-bar {
            width: 100%;
            background: #1B2A4A;
            border-radius: 3px 3px 0 0;
            min-height: 4px;
        }
        .graph-label { font-size: 10px; color: #6B7280; margin-top: 4px; }

        /* UTILISATEURS */
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1B2A4A;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            margin-right: 8px;
        }

        /* ACCES REFUSE */
        .acces-refuse {
            text-align: center;
            padding: 100px 40px;
        }

        footer {
            background: #0D1117;
            color: #D6E4F0;
            text-align: center;
            padding: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// Données démo
const statsData = [
    { label: "Utilisateurs", value: 248, color: "#185FA5", trend: "+12 ce mois", icon: "👥" },
    { label: "Destinations", value: 142, color: "#1B2A4A", trend: "+5 ce mois", icon: "🗺️" },
    { label: "Réservations", value: 91, color: "#1A6B4A", trend: "+8 ce mois", icon: "🧳" },
    { label: "Alertes", value: 12, color: "#E24B4A", trend: "À traiter", icon: "⚠️" },
];

const reservationsData = [
    { id:"#4521", nom:"Lucas Martin", dest:"Maldives", date:"15/06/2026", montant:"8 570 €", statut:"confirmee" },
    { id:"#4520", nom:"Aika Tanaka", dest:"Bali", date:"10/08/2026", montant:"5 200 €", statut:"en_attente" },
    { id:"#4519", nom:"Nina Rossi", dest:"Santorini", date:"02/10/2026", montant:"3 900 €", statut:"confirmee" },
    { id:"#4518", nom:"Marc Dupont", dest:"Dubaï", date:"05/07/2026", montant:"4 100 €", statut:"confirmee" },
    { id:"#4517", nom:"Sara Chen", dest:"Tokyo", date:"18/09/2026", montant:"6 800 €", statut:"annulee" },
];

const utilisateursData = [
    { id:1, nom:"Lucas Martin", email:"lucas@email.com", role:"voyageur", date:"12/01/2026", actif:true },
    { id:2, nom:"Aika Tanaka", email:"aika@email.com", role:"voyageur", date:"15/02/2026", actif:true },
    { id:3, nom:"Hotel Luxe Paris", email:"hotel@luxe.com", role:"prestataire", date:"20/02/2026", actif:true },
    { id:4, nom:"Sara Chen", email:"sara@email.com", role:"voyageur", date:"01/03/2026", actif:false },
    { id:5, nom:"Jean Dupont", email:"jean@email.com", role:"agent", date:"10/03/2026", actif:true },
];

const offresData = [
    { id:1, nom:"Villa Maldives Luxe", type:"hebergement", prestataire:"Hotel Luxe Co", statut:"en_attente" },
    { id:2, nom:"Safari Kenya Premium", type:"activite", prestataire:"Safari Tours", statut:"en_attente" },
    { id:3, nom:"Vol Paris-Tokyo", type:"transport", prestataire:"Air Luxe", statut:"validee" },
];

const graphData = [
    { mois:"Jan", val:45 },
    { mois:"Fev", val:52 },
    { mois:"Mar", val:38 },
    { mois:"Avr", val:65 },
    { mois:"Mai", val:78 },
    { mois:"Jun", val:91 },
];

const maxVal = Math.max(...graphData.map(d => d.val));

// ── NAVBAR ────────────────────────────────────────────────
function Navbar({ user }) {
    return (
        <nav className="navbar">
            <div className="navbar-logo" onClick={() => window.location.href='index.html'}>
                ✦ VoyageVista
                <span className="admin-badge">ADMIN</span>
            </div>
            <div>
                {user && (
                    <span style={{color:'white', fontSize:'13px'}}>
                        {user.prenom} {user.nom} &nbsp;
                        <button className="navbar-btn" onClick={() => {
                            localStorage.removeItem('vv_user');
                            window.location.href = 'index.html';
                        }}>
                            Déconnexion
                        </button>
                    </span>
                )}
            </div>
        </nav>
    );
}

// ── DASHBOARD ─────────────────────────────────────────────
function Dashboard() {
    return (
        <div>
            {/* STATS */}
            <div className="stats-grid">
                {statsData.map((s, i) => (
                    <div key={i} className="stat-card" style={{borderTopColor: s.color}}>
                        <div className="stat-number" style={{color: s.color}}>
                            {s.value}
                        </div>
                        <div className="stat-label">{s.icon} {s.label}</div>
                        <div className="stat-trend" style={{color: s.color}}>{s.trend}</div>
                    </div>
                ))}
            </div>

            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'20px'}}>
                {/* DERNIÈRES RÉSERVATIONS */}
                <div className="table-card">
                    <div className="table-header">
                        <div className="table-titre">Dernières réservations</div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Voyageur</th>
                                <th>Destination</th>
                                <th>Statut</th>
                            </tr>
                        </thead>
                        <tbody>
                            {reservationsData.slice(0,4).map(r => (
                                <tr key={r.id}>
                                    <td style={{color:'#6B7280'}}>{r.id}</td>
                                    <td><strong>{r.nom}</strong></td>
                                    <td>{r.dest}</td>
                                    <td>
                                        <span className={`badge ${
                                            r.statut === 'confirmee' ? 'badge-success' :
                                            r.statut === 'en_attente' ? 'badge-warning' :
                                            'badge-danger'
                                        }`}>
                                            {r.statut === 'confirmee' ? 'Confirmée' :
                                             r.statut === 'en_attente' ? 'En attente' : 'Annulée'}
                                        </span>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>

                {/* GRAPHIQUE */}
                <div className="table-card">
                    <div className="table-header">
                        <div className="table-titre">Réservations par mois</div>
                    </div>
                    <div style={{padding:'20px'}}>
                        <div className="graph-bars">
                            {graphData.map((d, i) => (
                                <div key={i} className="graph-bar-wrap">
                                    <div className="graph-bar"
                                        style={{height: `${(d.val/maxVal)*80}px`}}>
                                    </div>
                                    <div className="graph-label">{d.mois}</div>
                                </div>
                            ))}
                        </div>
                        <div style={{textAlign:'center', fontSize:'12px', color:'#6B7280', marginTop:'8px'}}>
                            Total : {graphData.reduce((s,d) => s+d.val, 0)} réservations
                        </div>
                    </div>
                </div>
            </div>
        </div>
    );
}

// ── UTILISATEURS ──────────────────────────────────────────
function Utilisateurs() {
    const [users, setUsers] = useState(utilisateursData);

    function changerRole(id, nouveauRole) {
        setUsers(users.map(u => u.id === id ? {...u, role: nouveauRole} : u));
    }

    function toggleActif(id) {
        setUsers(users.map(u => u.id === id ? {...u, actif: !u.actif} : u));
    }

    return (
        <div className="table-card">
            <div className="table-header">
                <div className="table-titre">Gestion des utilisateurs</div>
                <span style={{fontSize:'12px', color:'#6B7280'}}>{users.length} utilisateurs</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Utilisateur</th>
                        <th>Email</th>
                        <th>Rôle</th>
                        <th>Inscription</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {users.map(u => (
                        <tr key={u.id}>
                            <td>
                                <span className="user-avatar">
                                    {u.nom.split(' ').map(n=>n[0]).join('').slice(0,2)}
                                </span>
                                {u.nom}
                            </td>
                            <td style={{color:'#6B7280'}}>{u.email}</td>
                            <td>
                                <select
                                    value={u.role}
                                    onChange={e => changerRole(u.id, e.target.value)}
                                    style={{
                                        border:'1px solid #E2DDD6', borderRadius:'4px',
                                        padding:'3px 8px', fontSize:'12px', cursor:'pointer'
                                    }}>
                                    <option value="voyageur">Voyageur</option>
                                    <option value="prestataire">Prestataire</option>
                                    <option value="agent">Agent</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </td>
                            <td style={{color:'#6B7280'}}>{u.date}</td>
                            <td>
                                <span className={`badge ${u.actif ? 'badge-success' : 'badge-danger'}`}>
                                    {u.actif ? 'Actif' : 'Suspendu'}
                                </span>
                            </td>
                            <td>
                                <button className={`btn ${u.actif ? 'btn-danger' : 'btn-success'}`}
                                    onClick={() => toggleActif(u.id)}>
                                    {u.actif ? 'Suspendre' : 'Réactiver'}
                                </button>
                            </td>
                        </tr>
                    ))}
                </tbody>
            </table>
        </div>
    );
}

// ── RESERVATIONS ──────────────────────────────────────────
function Reservations() {
    const [reservations, setReservations] = useState(reservationsData);

    function changerStatut(id, statut) {
        setReservations(reservations.map(r => r.id === id ? {...r, statut} : r));
    }

    return (
        <div className="table-card">
            <div className="table-header">
                <div className="table-titre">Toutes les réservations</div>
                <span style={{fontSize:'12px', color:'#6B7280'}}>{reservations.length} réservations</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Voyageur</th>
                        <th>Destination</th>
                        <th>Date</th>
                        <th>Montant</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {reservations.map(r => (
                        <tr key={r.id}>
                            <td style={{color:'#6B7280', fontWeight:'bold'}}>{r.id}</td>
                            <td><strong>{r.nom}</strong></td>
                            <td>{r.dest}</td>
                            <td style={{color:'#6B7280'}}>{r.date}</td>
                            <td style={{fontWeight:'bold', color:'#1B2A4A'}}>{r.montant}</td>
                            <td>
                                <span className={`badge ${
                                    r.statut === 'confirmee' ? 'badge-success' :
                                    r.statut === 'en_attente' ? 'badge-warning' :
                                    'badge-danger'
                                }`}>
                                    {r.statut === 'confirmee' ? 'Confirmée' :
                                     r.statut === 'en_attente' ? 'En attente' : 'Annulée'}
                                </span>
                            </td>
                            <td>
                                {r.statut === 'en_attente' && (
                                    <>
                                        <button className="btn btn-success"
                                            onClick={() => changerStatut(r.id, 'confirmee')}>
                                            ✓
                                        </button>
                                        <button className="btn btn-danger"
                                            onClick={() => changerStatut(r.id, 'annulee')}>
                                            ✕
                                        </button>
                                    </>
                                )}
                                {r.statut !== 'en_attente' && (
                                    <span style={{fontSize:'12px', color:'#6B7280'}}>—</span>
                                )}
                            </td>
                        </tr>
                    ))}
                </tbody>
            </table>
        </div>
    );
}

// ── MODERATION OFFRES ─────────────────────────────────────
function Moderation() {
    const [offres, setOffres] = useState(offresData);

    function validerOffre(id) {
        setOffres(offres.map(o => o.id === id ? {...o, statut:'validee'} : o));
        alert('Offre validée ! Le prestataire sera notifié.');
    }

    function refuserOffre(id) {
        setOffres(offres.map(o => o.id === id ? {...o, statut:'refusee'} : o));
        alert('Offre refusée. Le prestataire sera notifié.');
    }

    return (
        <div className="table-card">
            <div className="table-header">
                <div className="table-titre">Modération des offres prestataires</div>
                <span className="badge badge-warning">
                    {offres.filter(o => o.statut === 'en_attente').length} en attente
                </span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Offre</th>
                        <th>Type</th>
                        <th>Prestataire</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {offres.map(o => (
                        <tr key={o.id}>
                            <td><strong>{o.nom}</strong></td>
                            <td>
                                <span className="badge badge-blue">
                                    {o.type === 'hebergement' ? '🏨' :
                                     o.type === 'activite' ? '🤿' : '✈️'} {o.type}
                                </span>
                            </td>
                            <td>{o.prestataire}</td>
                            <td>
                                <span className={`badge ${
                                    o.statut === 'validee' ? 'badge-success' :
                                    o.statut === 'refusee' ? 'badge-danger' :
                                    'badge-warning'
                                }`}>
                                    {o.statut === 'validee' ? '✓ Validée' :
                                     o.statut === 'refusee' ? '✕ Refusée' : '⏳ En attente'}
                                </span>
                            </td>
                            <td>
                                {o.statut === 'en_attente' && (
                                    <>
                                        <button className="btn btn-success"
                                            onClick={() => validerOffre(o.id)}>
                                            Valider
                                        </button>
                                        <button className="btn btn-danger"
                                            onClick={() => refuserOffre(o.id)}>
                                            Refuser
                                        </button>
                                    </>
                                )}
                                {o.statut !== 'en_attente' && (
                                    <span style={{fontSize:'12px', color:'#6B7280'}}>Traité</span>
                                )}
                            </td>
                        </tr>
                    ))}
                </tbody>
            </table>
        </div>
    );
}

// ── APP PRINCIPAL ─────────────────────────────────────────
function App() {
    const [user, setUser] = useState(() => {
    try {
        return JSON.parse(localStorage.getItem('vv_user')) || null;
    } catch(e) {
        return null;
    }
});
    const [onglet, setOnglet] = useState('dashboard');

    // Vérifier que c'est un admin
    if (!user || user.role !== 'admin') {
        return (
            <div>
                <nav className="navbar">
                    <div className="navbar-logo">✦ VoyageVista</div>
                </nav>
                <div className="acces-refuse">
                    <div style={{fontSize:'60px', marginBottom:'20px'}}>🔒</div>
                    <h2 style={{color:'#1B2A4A', marginBottom:'10px'}}>Accès refusé</h2>
                    <p style={{color:'#6B7280', marginBottom:'25px'}}>
                        Cette page est réservée aux administrateurs.
                    </p>
                    <button style={{
                        background:'#1B2A4A', color:'white', border:'none',
                        padding:'12px 25px', borderRadius:'4px', cursor:'pointer'
                    }} onClick={() => window.location.href='index.html'}>
                        Retour à l'accueil
                    </button>
                </div>
            </div>
        );
    }

    const menuItems = [
        { id:'dashboard', label:'Dashboard', icon:'📊' },
        { id:'reservations', label:'Réservations', icon:'🧳', badge:3 },
        { id:'utilisateurs', label:'Utilisateurs', icon:'👥' },
        { id:'moderation', label:'Modération', icon:'✅', badge:2 },
    ];

    function renderContenu() {
        switch(onglet) {
            case 'dashboard': return <Dashboard />;
            case 'reservations': return <Reservations />;
            case 'utilisateurs': return <Utilisateurs />;
            case 'moderation': return <Moderation />;
            default: return <Dashboard />;
        }
    }

    const titres = {
        dashboard: 'Dashboard',
        reservations: 'Gestion des réservations',
        utilisateurs: 'Gestion des utilisateurs',
        moderation: 'Modération des offres',
    };

    return (
        <div>
            <Navbar user={user} />
            <div className="layout">
                {/* SIDEBAR */}
                <div className="sidebar">
                    <div className="sidebar-title">Administration</div>
                    {menuItems.map(item => (
                        <div key={item.id}
                            className={`menu-item ${onglet === item.id ? 'active' : ''}`}
                            onClick={() => setOnglet(item.id)}>
                            <span>{item.icon}</span>
                            <span>{item.label}</span>
                            {item.badge && (
                                <span className="menu-badge">{item.badge}</span>
                            )}
                        </div>
                    ))}
                </div>

                {/* CONTENU */}
                <div className="main-content">
                    <div className="page-title">{titres[onglet]}</div>
                    {renderContenu()}
                </div>
            </div>
            <footer>
                © 2026 VoyageVista — FARES · BENZIDOUN · ADDOU · ANDRIAMPARANY
            </footer>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
