        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #F8F6F1; color: #1A1A2E; }

        .navbar {
            background: #1B2A4A;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-logo { color: white; font-size: 22px; font-weight: bold; cursor: pointer; }
        .navbar-links a { color: #D6E4F0; text-decoration: none; margin-left: 25px; font-size: 14px; }
        .navbar-btn {
            background: transparent; color: white; border: 1px solid white;
            padding: 8px 16px; cursor: pointer; border-radius: 4px; margin-left: 10px; font-size: 13px;
        }

        /* HERO DESTINATION */
        .dest-hero {
            height: 320px;
            background: #1B2A4A;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .dest-hero-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.6));
            padding: 30px 40px 20px;
            color: white;
        }
        .breadcrumb { font-size: 12px; color: #D6E4F0; margin-bottom: 8px; }
        .breadcrumb a { color: #D6E4F0; text-decoration: none; }
        .dest-hero-nom { font-size: 36px; font-weight: bold; }
        .dest-hero-pays { font-size: 16px; color: #D6E4F0; margin-top: 5px; }

        /* BADGES */
        .badges-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-navy { background: #1B2A4A; color: white; }
        .badge-light { background: rgba(255,255,255,0.2); color: white; }
        .badge-success { background: #D5F0E4; color: #1A6B4A; }
        .badge-warning { background: #FDE8D0; color: #C75B00; }

        /* LAYOUT */
        .layout { display: flex; gap: 25px; padding: 30px 40px; align-items: flex-start; }
        .content-left { flex: 1; }

        /* ONGLETS */
        .onglets { display: flex; border-bottom: 2px solid #E2DDD6; margin-bottom: 25px; }
        .onglet { padding: 12px 20px; cursor: pointer; font-size: 14px; color: #6B7280; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .onglet.active { color: #1B2A4A; font-weight: bold; border-bottom: 2px solid #1B2A4A; }

        /* HOTELS */
        .hotel-card { background: white; border-radius: 8px; border: 1px solid #E2DDD6; display: flex; margin-bottom: 15px; overflow: hidden; }
        .hotel-img { width: 120px; height: 120px; background: #D6E4F0; background-size: cover; background-position: center; flex-shrink: 0; }
        .hotel-body { padding: 15px; flex: 1; display: flex; justify-content: space-between; align-items: center; }
        .hotel-info { flex: 1; }
        .hotel-nom { font-size: 15px; font-weight: bold; color: #1A1A2E; margin-bottom: 4px; }
        .hotel-type { font-size: 12px; color: #6B7280; margin-bottom: 6px; }
        .hotel-etoiles { color: #BA7517; font-size: 13px; margin-bottom: 6px; }
        .hotel-equip { font-size: 11px; color: #6B7280; }
        .hotel-prix-bloc { text-align: right; }
        .hotel-prix { font-size: 18px; font-weight: bold; color: #1B2A4A; }
        .hotel-prix-label { font-size: 11px; color: #6B7280; }
        .btn-reserver { background: #1B2A4A; color: white; border: none; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; margin-top: 8px; display: block; }
        .btn-reserver:hover { background: #2C3E6B; }

        /* TRANSPORTS */
        .transport-card { background: white; border-radius: 8px; border: 1px solid #E2DDD6; padding: 15px 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 20px; }
        .transport-icon { font-size: 28px; flex-shrink: 0; }
        .transport-info { flex: 1; }
        .transport-trajet { font-size: 14px; font-weight: bold; color: #1A1A2E; }
        .transport-details { font-size: 12px; color: #6B7280; margin-top: 3px; }
        .transport-dispo { font-size: 11px; margin-top: 4px; }
        .transport-prix-bloc { text-align: right; }
        .transport-prix { font-size: 18px; font-weight: bold; color: #1B2A4A; }
        .transport-prix-label { font-size: 11px; color: #6B7280; }
        .btn-selectionner { background: white; color: #1B2A4A; border: 1px solid #1B2A4A; padding: 7px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 6px; display: block; }

        /* ACTIVITES */
        .activite-card { background: white; border-radius: 8px; border: 1px solid #E2DDD6; padding: 15px; margin-bottom: 12px; display: flex; gap: 15px; align-items: center; }

        .activite-info { flex: 1; }
        .activite-nom { font-size: 14px; font-weight: bold; color: #1A1A2E; margin-bottom: 4px; }
        .activite-details { font-size: 12px; color: #6B7280; }
        .activite-prix-bloc { text-align: right; }
        .activite-prix { font-size: 16px; font-weight: bold; color: #1B2A4A; }
        .activite-label { font-size: 11px; color: #6B7280; }
        .btn-ajouter { background: #1B2A4A; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 6px; }
        .btn-ajouter.ajoute { background: #1A6B4A; }

        /* AVIS */
        .avis-card { background: white; border-radius: 8px; border: 1px solid #E2DDD6; padding: 15px; margin-bottom: 12px; }
        .avis-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .avis-auteur { font-size: 13px; font-weight: bold; color: #1A1A2E; }
        .avis-date { font-size: 11px; color: #6B7280; }
        .avis-note { color: #BA7517; font-size: 13px; margin-bottom: 6px; }
        .avis-texte { font-size: 13px; color: #6B7280; line-height: 1.5; }

        /* WIDGET DROITE */
        .widget-resa { width: 300px; flex-shrink: 0; position: sticky; top: 20px; }
        .widget-card { background: white; border-radius: 8px; border: 2px solid #1B2A4A; padding: 20px; }
        .widget-titre { font-size: 15px; font-weight: bold; color: #1B2A4A; margin-bottom: 15px; text-align: center; }
        .widget-field { margin-bottom: 12px; }
        .widget-field label { display: block; font-size: 11px; color: #6B7280; text-transform: uppercase; margin-bottom: 5px; }
        .widget-field input { width: 100%; padding: 9px; border: 1px solid #E2DDD6; border-radius: 4px; font-size: 13px; }
        .widget-total { border-top: 1px solid #E2DDD6; padding-top: 12px; margin-top: 12px; }
        .widget-total-row { display: flex; justify-content: space-between; font-size: 13px; color: #6B7280; margin-bottom: 5px; }
        .widget-total-main { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: #1B2A4A; margin-top: 8px; }
        .btn-panier { width: 100%; background: #1B2A4A; color: white; border: none; padding: 13px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; margin-top: 12px; }

        .btn-sauvegarder { width: 100%; background: white; color: #1B2A4A; border: 1px solid #1B2A4A; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 13px; margin-top: 8px; }

    function calculerTotal() {
        let total = 0;
        if (transportSelectionne) total += transportSelectionne.prix * nbVoyageurs;
        if (hotelSelectionne && dateArrivee && dateDepart) {
            const d1 = new Date(dateArrivee);
            const d2 = new Date(dateDepart);
            const nuits = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)));
            total += hotelSelectionne.prix * nuits;
        }
        activitesSelectionnees.forEach(a => total += a.prix * nbVoyageurs);
        return total;
    }

    function toggleActivite(activite) {
        setActivitesSelectionnees(prev =>
            prev.find(a => a.id === activite.id)
                ? prev.filter(a => a.id !== activite.id)
                : [...prev, activite]
        );
    }

        if (!hotelSelectionne && !transportSelectionne) {

            return;

            alert('La date de départ doit être après la date d\'arrivée !');
            return;
        }
        const panier = {
            destination: destination.nom,
            hotel: hotelSelectionne,
            transport: transportSelectionne,
            activites: activitesSelectionnees,
            dateArrivee, dateDepart, nbVoyageurs,
            total: calculerTotal()
        };
        localStorage.setItem('vv_panier', JSON.stringify(panier));
        alert('Ajouté au panier ! Redirection...');

                                                {hotelSelectionne?.id === hotel.id ? '✓ Sélectionné' : 'Sélectionner'}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* TRANSPORTS */}
                    {onglet === 'transports' && (
                        <div>
                            {transports.map(t => (
                                <div key={t.id} className="transport-card"
                                    style={transportSelectionne?.id === t.id ? {border:'2px solid #1B2A4A'} : {}}>
                                    <div className="transport-icon">{t.icon}</div>
                                    <div className="transport-info">
                                        <div className="transport-trajet">{t.trajet}</div>
                                        <div className="transport-details">{t.compagnie} · {t.duree}</div>
                                        <div className="transport-dispo"
                                            style={{color: t.places <= 5 ? '#C75B00' : '#1A6B4A'}}>
                                            {t.places} places disponibles
                                        </div>
                                    </div>
                                    <div className="transport-prix-bloc">
                                        <div className="transport-prix">{t.prix} €</div>
                                        <div className="transport-prix-label">/ personne</div>
                                        <button className="btn-selectionner"
                                            style={transportSelectionne?.id === t.id ? {background:'#1B2A4A', color:'white'} : {}}
                                            onClick={() => setTransportSelectionne(
                                                transportSelectionne?.id === t.id ? null : t
                                            )}>
                                            {transportSelectionne?.id === t.id ? '✓ Sélectionné' : 'Sélectionner'}
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* ACTIVITES */}
                    {onglet === 'activites' && (
                        <div>
                            {activites.map(act => {
                                const estAjoute = activitesSelectionnees.find(a => a.id === act.id);
                                return (
                                    <div key={act.id} className="activite-card"
                                        style={estAjoute ? {border:'2px solid #1A6B4A'} : {}}>
                                        <div className="activite-icon">{act.icon}</div>
                                        <div className="activite-info">
                                            <div className="activite-nom">{act.nom}</div>
                                            <div className="activite-details">⏱ {act.duree} · 👥 {act.capacite}</div>
                                        </div>
                                        <div className="activite-prix-bloc">
                                            <div className="activite-prix">{act.prix} €</div>
                                            <div className="activite-label">/ personne</div>
                                            <button
                                                className={`btn-ajouter ${estAjoute ? 'ajoute' : ''}`}
                                                onClick={() => toggleActivite(act)}>
                                                {estAjoute ? '✓ Ajouté' : '+ Ajouter'}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* AVIS */}
                    {onglet === 'avis' && (
                        <div>
                            <div style={{
                                background:'white', borderRadius:'8px',
                                border:'1px solid #E2DDD6', padding:'20px',
                                marginBottom:'20px', textAlign:'center'
                            }}>
                                <div style={{fontSize:'48px', fontWeight:'bold', color:'#1B2A4A'}}>
                                    {destination.note_moyenne}
                                </div>
                                <div style={{color:'#BA7517', fontSize:'20px', margin:'5px 0'}}>
                                    ★★★★★
                                </div>
                                <div style={{fontSize:'13px', color:'#6B7280'}}>
                                    Basé sur {nbAvis} avis
                                </div>
                            </div>
                            {avis.length === 0 && (
                                <div style={{textAlign:'center', color:'#6B7280', padding:'30px'}}>
                                    Aucun avis pour cette destination.
                                </div>
                            )}
                            {avis.map(a => (
                                <div key={a.id} className="avis-card">
                                    <div className="avis-header">
                                        <div className="avis-auteur">{a.auteur}</div>
                                        <div className="avis-date">{a.date}</div>
                                    </div>
                                    <div className="avis-note">{'★'.repeat(a.note)}</div>
                                    <div className="avis-texte">{a.texte}</div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>

                {/* WIDGET RESERVATION DROITE */}
                <div className="widget-resa">
                    <div className="widget-card">
                        <div className="widget-titre">✦ Composer mon séjour</div>

                        <div className="widget-field">
                            <label>Date d'arrivée</label>
                            <input type="date" value={dateArrivee}
                                min={new Date().toISOString().split('T')[0]}
                                onChange={e => setDateArrivee(e.target.value)} />
                        </div>
                        <div className="widget-field">
                            <label>Date de départ</label>
                            <input type="date" value={dateDepart}
                                min={dateArrivee || new Date().toISOString().split('T')[0]}
                                onChange={e => setDateDepart(e.target.value)} />
                        </div>
                        <div className="widget-field">
                            <label>Voyageurs</label>
                            <input type="number" min="1" max="20" value={nbVoyageurs}
                                onChange={e => setNbVoyageurs(Number(e.target.value))} />
                        </div>

                        <div className="widget-total">
                            {transportSelectionne && (
                                <div className="widget-total-row">
                                    <span>✈️ {transportSelectionne.compagnie}</span>
                                    <span>{(transportSelectionne.prix * nbVoyageurs).toLocaleString()} €</span>
                                </div>
                            )}
                            {hotelSelectionne && (
                                <div className="widget-total-row">
                                    <span>🏨 {hotelSelectionne.nom}</span>
                                    <span>{hotelSelectionne.prix} € / nuit</span>
                                </div>
                            )}
                            {activitesSelectionnees.length > 0 && (
                                <div className="widget-total-row">
                                    <span>🎯 Activités ({activitesSelectionnees.length})</span>
                                    <span>{activitesSelectionnees.reduce((s, a) => s + a.prix * nbVoyageurs, 0)} €</span>
                                </div>
                            )}
                            <div className="widget-total-main">
                                <span>Total estimé</span>
                                <span>{calculerTotal().toLocaleString()} €</span>
                            </div>
                        </div>

                        <button className="btn-panier" onClick={ajouterAuPanier}>
                            🛒 Ajouter au panier
                        </button>
                        <button className="btn-sauvegarder"
                            onClick={() => alert('Connexion requise pour sauvegarder !')}>
                            ❤️ Sauvegarder
                        </button>
                    </div>
                </div>
            </div>

            <footer>
                © 2026 VoyageVista — FARES · BENZIDOUN · ADDOU · ANDRIAMPARANY
            </footer>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
